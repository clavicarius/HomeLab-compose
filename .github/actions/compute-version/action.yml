name: Compute semantic version
description: Computes the next semantic version tag and major moving tag.

outputs:
  next_tag:
    description: The next full semantic version tag (v<major>.<minor>.<patch>).
    value: ${{ steps.compute.outputs.next_tag }}
  major_tag:
    description: The moving major tag (v<major>).
    value: ${{ steps.compute.outputs.major_tag }}
  tag_exists_on_origin:
    description: Whether next_tag already exists on origin.
    value: ${{ steps.compute.outputs.tag_exists_on_origin }}

runs:
  using: composite
  steps:
    - name: Compute next semantic version
      id: compute
      shell: bash
      run: |
        set -euo pipefail

        SEMVER_TAGS=$(
          git tag -l \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            || true
        )

        if [ -z "$SEMVER_TAGS" ]; then
          NEXT_TAG="v0.1.0"
          MAJOR_TAG="v0"
        else
          LATEST=$(
            echo "$SEMVER_TAGS" \
              | sed 's/^v//' \
              | sort -V \
              | tail -n 1
          )

          IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST"
          NEXT_PATCH=$((PATCH + 1))

          NEXT_TAG="v${MAJOR}.${MINOR}.${NEXT_PATCH}"
          MAJOR_TAG="v${MAJOR}"
        fi

        if git ls-remote --exit-code --tags origin "refs/tags/${NEXT_TAG}" >/dev/null 2>&1; then
          TAG_EXISTS_ON_ORIGIN="true"
        else
          TAG_EXISTS_ON_ORIGIN="false"
        fi

        echo "next_tag=${NEXT_TAG}" >> "$GITHUB_OUTPUT"
        echo "major_tag=${MAJOR_TAG}" >> "$GITHUB_OUTPUT"
        echo "tag_exists_on_origin=${TAG_EXISTS_ON_ORIGIN}" >> "$GITHUB_OUTPUT"
