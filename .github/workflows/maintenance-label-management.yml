name: Maintenance Label Management

on:
  push:
    branches:
      - main
    paths:
      - '.github/gh-labels.csv'
      - '.github/workflows/maintenance-label-management.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  manage-labels:
    name: Create or update repository labels
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Manage labels
        if: hashFiles('.github/gh-labels.csv') != ''
        uses: clavicarius/ci-platform/actions/maintenance-label-management@v1
        with:
          csv-file: .github/gh-labels.csv
          github-token: ${{ github.token }}

      - name: Enforce CSV as source of truth
        if: hashFiles('.github/gh-labels.csv') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import csv
          import json
          import os
          import subprocess

          repository = os.environ["GITHUB_REPOSITORY"]
          with open(".github/gh-labels.csv", encoding="utf-8-sig", newline="") as source:
              configured = {
                  row["name"].strip()
                  for row in csv.DictReader(source, delimiter=";")
                  if row.get("name", "").strip()
              }

          pages = json.loads(
              subprocess.check_output(
                  [
                      "gh",
                      "api",
                      "--paginate",
                      "--slurp",
                      f"repos/{repository}/labels?per_page=100",
                  ],
                  text=True,
              )
          )
          existing = {label["name"] for page in pages for label in page}

          for name in sorted(existing - configured):
              print(f"Removing label {name!r}")
              subprocess.run(
                  ["gh", "label", "delete", name, "--repo", repository, "--yes"],
                  check=True,
              )
          PY
