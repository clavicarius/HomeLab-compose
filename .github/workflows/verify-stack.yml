name: Verify Stack

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  discover:
    name: Discover Compose Stacks
    runs-on: ubuntu-latest
    outputs:
      stacks: ${{ steps.discover.outputs.stacks }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Discover stacks
        id: discover
        shell: bash
        run: |
          stacks=$(find . \
            -mindepth 2 \
            -maxdepth 3 \
            \( \
              -name "docker-compose.yml" \
              -o \
              -name "compose.yml" \
            \) \
            -printf '%h\n' \
            | sed 's|^\./||' \
            | sort -u \
            | jq -R -s -c 'split("\n")[:-1]')

          echo "Detected stacks:"
          echo "$stacks"
          echo "stacks=$stacks" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify ${{ matrix.stack }}
    needs:
      - discover
    if: needs.discover.outputs.stacks != '[]'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJson(needs.discover.outputs.stacks) }}

    defaults:
      run:
        working-directory: ${{ matrix.stack }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare CI environment
        shell: bash
        run: |
          rm -f .env.ci

          FOUND=0

          if [ -f "../.env.common.example" ]; then
            cat ../.env.common.example >> .env.ci
            echo "" >> .env.ci
            FOUND=1
          fi

          if [ -f ".env.example" ]; then
            cat .env.example >> .env.ci
            echo "" >> .env.ci
            FOUND=1
          fi

          if [ "$FOUND" -eq 0 ]; then
            echo "No environment file found."
            exit 1
          fi

          # Use a dedicated private test subnet in CI so that gateway and fixed
          # service IPs are guaranteed to be within the same network.
          sed -i 's/^SUBNET=.*/SUBNET=172.25.0.0\/24/' .env.ci
          sed -i 's/^GATEWAY=.*/GATEWAY=172.25.0.1/' .env.ci

          # Map any *_IP variables into the CI subnet, preserving the last octet.
          sed -i -E 's/^([A-Z0-9_]+_IP=)([0-9]{1,3}\.){3}([0-9]{1,3})/\1172.25.0.\3/' .env.ci

          echo "Using environment:"
          cat .env.ci

      - name: Prepare compose arguments
        id: compose
        shell: bash
        run: |
          COMPOSE_ARGS="-f docker-compose.yml"

          if [ ! -f docker-compose.yml ] && [ -f compose.yml ]; then
            COMPOSE_ARGS="-f compose.yml"
          fi

          if [ -f docker-compose.ci.yml ]; then
            echo "Using docker-compose.ci.yml override"
            COMPOSE_ARGS="$COMPOSE_ARGS -f docker-compose.ci.yml"
          fi

          if [ -f compose.ci.yml ]; then
            echo "Using compose.ci.yml override"
            COMPOSE_ARGS="$COMPOSE_ARGS -f compose.ci.yml"
          fi

          echo "compose_args=$COMPOSE_ARGS" >> "$GITHUB_OUTPUT"

      - name: Validate compose file
        shell: bash
        run: |
          docker compose \
            ${{ steps.compose.outputs.compose_args }} \
            --env-file .env.ci \
            config

      - name: Run dashboard unit tests
        if: matrix.stack == 'dashboard'
        working-directory: ${{ github.workspace }}
        run: python -m unittest dashboard.test_server

      - name: Start stack
        shell: bash
        run: |
          docker compose \
            ${{ steps.compose.outputs.compose_args }} \
            --env-file .env.ci \
            up -d --wait

      - name: Check container status
        shell: bash
        run: |
          docker compose \
            ${{ steps.compose.outputs.compose_args }} \
            --env-file .env.ci \
            ps

          FAILED=$(
            docker compose \
              ${{ steps.compose.outputs.compose_args }} \
              --env-file .env.ci \
              ps --format json |
            jq -r '
              select(
                .State != "running"
              )
              | .Name
            '
          )

          if [ -n "$FAILED" ]; then
            echo "The following containers failed:"
            echo "$FAILED"

            docker compose \
              ${{ steps.compose.outputs.compose_args }} \
              --env-file .env.ci \
              logs --no-color

            exit 1
          fi

  verify-success:
    name: Verify Compose Stacks

    needs:
      - verify

    if: always()

    runs-on: ubuntu-latest

    steps:
      - name: Check verification result
        shell: bash
        run: |
          if [ "${{ needs.verify.result }}" != "success" ] \
             && [ "${{ needs.verify.result }}" != "skipped" ]; then
            echo "Compose verification failed"
            exit 1
          fi

          echo "All compose stacks verified successfully"
