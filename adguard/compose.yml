# ${ADGUARD_HOST}.${HOMELAB_DOMAIN}
# docker compose file for adguard
#
# AdGuard Home — network-wide ad and tracker blocker acting as the LAN DNS server.
# The container receives a static macvlan LAN-IP (${ADGUARD_IP}) so that all
# devices can use it as a DNS resolver.
#
# Documentation : adguard/README.md
# Network setup : docs/network-architecture.md
# Helper scripts : docs/scripts.md

services:
  # adguardhome — DNS server and ad-blocker for the entire homelab LAN.
  #
  # Exposes:
  #   port 53/tcp+udp  — DNS queries from LAN devices
  #   port 3000        — Admin web UI (initial setup wizard and dashboard)
  #
  # Volumes:
  #   ./conf  — persistent AdGuard configuration (filters, DNS settings, users)
  #   ./work  — runtime data (query logs, statistics, filter lists)
  #
  # Healthcheck: polls /control/status every 30 s via wget.
  adguardhome:
    container_name: adguard-homelab
    # https://hub.docker.com/r/adguard/adguardhome/tags
    image: adguard/adguardhome:latest
    restart: unless-stopped
    networks:
      homelab_macvlan:
        ipv4_address: ${ADGUARD_IP}  # fixe IP
    volumes:
      - ./conf:/opt/adguardhome/conf
      - ./work:/opt/adguardhome/work

    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    
    labels:
      - "traefik.enable=${TRAEFIK_ENABLED}"
      - "traefik.http.routers.adguard.tls=${TRAEFIK_TLS_ENABLED}"
      - "traefik.http.routers.adguard.entrypoints=websecure"
      - "traefik.http.routers.adguard.rule=Host(`${ADGUARD_HOST}.${HOMELAB_DOMAIN}`)"
      - "traefik.http.services.adguard.loadbalancer.server.port=3000"
      - "traefik.docker.network=homelab_macvlan"
      
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/control/status >/dev/null || exit 1"] 
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  homelab_macvlan:
    external: true