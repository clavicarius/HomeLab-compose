<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HomeLab Dashboard</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="shell">
    <header class="masthead">
      <p class="eyebrow">HomeLab</p>
      <h1>Deine Services.</h1>
      <p class="intro">Ein zentraler Einstiegspunkt fuer alle veroeffentlichten Anwendungen.</p>
    </header>
    <label class="search-field">
      <span class="sr-only">Services suchen</span>
      <input id="service-search" type="search" placeholder="Services suchen ..." autocomplete="off">
    </label>
    <section id="services" class="services" aria-live="polite">
      <p class="state">Services werden geladen ...</p>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
