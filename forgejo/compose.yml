# ${FORGEJO_HOST}.${HOMELAB_DOMAIN}
# docker compose file for gitea
#
# Gitea — lightweight self-hosted Git service with web UI, SSH, and issue tracking.
# The container receives a static macvlan LAN-IP (${FORGEJO_IP}) and also publishes
# its web and SSH ports on the host for direct access without a reverse proxy.
#
# Documentation : gitea/README.md
# Network setup : docs/network-architecture.md
# Helper scripts : docs/scripts.md

services:
  # forgejo — self-hosted Git service (web UI + SSH).
  #
  # Exposes (via published host ports):
  #   ${FORGEJO_PORT}:3000   — web interface
  #   ${FORGEJO_SSH_PORT}:22 — SSH access for git clone/push/pull
  #
  # Volumes:
  #   ./data          — repositories, forgejo configuration, and SQLite database
  #   /etc/timezone   — timezone file from the host (Synology NAS path used)
  #   /etc/localtime  — localtime from the host
  #
  # Database: SQLite3 (default); path /data/gitea/gitea.db inside the container.
  # Healthcheck: polls the web root every 30 s via wget.
  forgejo:
    container_name: forgejo
    # https://codeberg.org/forgejo/forgejo/tags
    image: codeberg.org/forgejo/forgejo:15
    restart: unless-stopped
    networks:
      homelab_macvlan:
        ipv4_address: ${FORGEJO_IP}  # fixe IP
    volumes:
      - ./data:/data
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "${FORGEJO_PORT}:3000"  # web-ui
      - "${FORGEJO_SSH_PORT}:22"  # ssh

    environment:
      - USER_UID=${PUID}
      - USER_GID=${PGID}
      - TZ=${TZ}
    
    labels:
      - "traefik.enable=${TRAEFIK_ENABLED}"
      - "traefik.http.routers.forgejo.tls=${TRAEFIK_TLS_ENABLED}"
      - "traefik.http.routers.forgejo.entrypoints=websecure"
      - "traefik.http.routers.forgejo.rule=Host(`${FORGEJO_HOST}.${HOMELAB_DOMAIN}`)"
      - "traefik.http.routers.forgejo.loadbalancer.server.port=3000"

    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  homelab_macvlan:
    external: true
