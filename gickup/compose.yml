# Gickup repository backup service.
#
# Gickup connects to Gitea on the shared homelab network and stores local
# mirrors under the host path configured by GICKUP_BACKUPS_PATH.

services:
  gickup:
    container_name: gickup-homelab
    image: buddyspencer/gickup:0.10.47
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pgrep", "-f", "^/gickup/gickup"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - ${GICKUP_BACKUPS_PATH}:/backups
    configs:
      - source: gickup_config
        target: /gickup/conf.yml
    networks:
      homelab_macvlan:
        ipv4_address: ${GICKUP_IP}

configs:
  gickup_config:
    content: |
      source:
        gitea:
          - url: "${GITEA_URL}"
            token: "${GITEA_TOKEN}"
      destination:
        local:
          - path: /backups
            structured: true
            mirror: true
      cron: "${GICKUP_CRON:-0 23 * * *}"

networks:
  homelab_macvlan:
    external: true
    name: ${NETWORK_NAME}
