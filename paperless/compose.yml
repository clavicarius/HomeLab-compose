# ${PAPERLESS_HOST}.${HOMELAB_DOMAIN}
# Docker Compose file for Paperless-ngx.
#
# Documentation : paperless/README.md
# Network setup : docs/network-architecture.md

services:
  paperless:
    container_name: paperless-homelab
    image: paperlessngx/paperless-ngx:3.3
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      homelab_macvlan:
        ipv4_address: ${PAPERLESS_IP}
      paperless_internal: {}
    volumes:
      - ${PAPERLESS_DATA_PATH}:/usr/src/paperless/data
      - ${PAPERLESS_MEDIA_PATH}:/usr/src/paperless/media
      - ${PAPERLESS_EXPORT_PATH}:/usr/src/paperless/export
      - ${PAPERLESS_CONSUME_PATH}:/usr/src/paperless/consume
      - ${PAPERLESS_SCRIPT_PATH}:/usr/src/paperless/scripts:ro
    environment:
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_DBHOST: db
      PAPERLESS_DBNAME: paperless
      PAPERLESS_DBUSER: paperless
      PAPERLESS_DBPASS: ${PAPERLESS_DB_PASSWORD}
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY}
      PAPERLESS_URL: https://${PAPERLESS_HOST}.${HOMELAB_DOMAIN}
      PAPERLESS_TIME_ZONE: ${TZ}
      PAPERLESS_OCR_LANGUAGE: deu+eng
      PAPERLESS_PRE_CONSUME_SCRIPT: /usr/src/paperless/scripts/pre_consume.sh
      PAPERLESS_POST_CONSUME_SCRIPT: /usr/src/paperless/scripts/post_consume.sh
      USERMAP_UID: ${PUID}
      USERMAP_GID: ${PGID}
    labels:
      - "traefik.enable=${TRAEFIK_ENABLED}"
      - "traefik.http.routers.paperless.entrypoints=websecure"
      - "traefik.http.routers.paperless.rule=Host(`${PAPERLESS_HOST}.${HOMELAB_DOMAIN}`)"
      - "traefik.http.services.paperless.loadbalancer.server.port=8000"
      - "traefik.docker.network=${NETWORK_NAME}"
      - "homelab.name=Paperless-ngx"
      - "homelab.icon=Document"
      - "homelab.category=Productivity"
      - "homelab.description=Self-hosted document management and OCR"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    networks:
      - paperless_internal
    volumes:
      - ${PAPERLESS_DB_DATA_PATH}:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: ${PAPERLESS_DB_PASSWORD}
    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5

  broker:
    image: redis:8-alpine
    restart: unless-stopped
    networks:
      - paperless_internal
    volumes:
      - ${PAPERLESS_REDIS_DATA_PATH}:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  dbdata:
  redisdata:

networks:
  homelab_macvlan:
    external: true
    name: ${NETWORK_NAME}
  paperless_internal:
    internal: true
