# ${PORTAINER_HOST}.${HOMELAB_DOMAIN}
# Docker Compose file for the standalone Portainer management stack.
#
# Documentation : portainer/README.md
# Network setup : docs/network-architecture.md

services:
  portainer:
    image: portainer/portainer-ce:lts
    container_name: portainer-homelab
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/portainer", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - ${DOCKER_SOCKET_PATH}:/var/run/docker.sock
      - ${PORTAINER_DATA_PATH}:/data
    networks:
      homelab_macvlan:
        ipv4_address: ${PORTAINER_IP}
    labels:
      - "traefik.enable=${TRAEFIK_ENABLED}"
      - "traefik.http.routers.portainer.entrypoints=websecure"
      - "traefik.http.routers.portainer.rule=Host(`${PORTAINER_HOST}.${HOMELAB_DOMAIN}`)"
      - "traefik.http.services.portainer.loadbalancer.server.port=9000"
      - "traefik.docker.network=${NETWORK_NAME}"
      - "homelab.name=Portainer"
      - "homelab.icon=Docker"
      - "homelab.category=Infrastructure"
      - "homelab.description=Docker-Umgebungsverwaltung"

networks:
  homelab_macvlan:
    external: true
    name: ${NETWORK_NAME}
