# traefik.${HOMELAB_DOMAIN}
# Docker Compose file for the standalone Traefik reverse proxy.
#
# Traefik provides the shared HTTP/HTTPS entrypoints and discovers enabled
# services through the Docker provider on the external homelab network.
#
# Documentation : traefik/README.md
# Network setup : docs/network-architecture.md
# Helper scripts : docs/scripts.md

services:
  # traefik — standalone reverse proxy for all homelab services.
  #
  # Exposes:
  #   80                         — HTTP entrypoint, redirected to HTTPS
  #   443                        — HTTPS entrypoint
  #   ${TRAEFIK_DASHBOARD_PORT}  — insecure dashboard/API
  #
  # Volumes:
  #   /var/run/docker.sock:ro — read-only Docker socket for service discovery
  #   ./certs:ro              — optional TLS certificates
  #
  # Static IP: ${TRAEFIK_IP} on the external homelab network.
  traefik:
    image: traefik:v3.7
    container_name: traefik-homelab
    restart: unless-stopped
    command:
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      - "--entrypoints.websecure.address=:443"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=${NETWORK_NAME}"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--api.dashboard=true"
      - "--api.insecure=false"
      - "--certificatesresolvers.${CERT_RESOLVER}.acme.email=${STEP_CA_ACME_EMAIL}"
      - "--certificatesresolvers.${CERT_RESOLVER}.acme.storage=/data/acme.json"
      - "--certificatesresolvers.${CERT_RESOLVER}.acme.caserver=${STEP_CA_ACME_URL}"
      - "--certificatesresolvers.${CERT_RESOLVER}.acme.httpchallenge.entrypoint=web"
      - "--ping=true"
    ports:
      - "80:80"
      - "443:443"
      - "${TRAEFIK_DASHBOARD_PORT:-8088}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./certs:/certs:ro
      - ./acme:/data
      - ./config:/etc/traefik/dynamic:ro
    networks:
      homelab_macvlan:
        ipv4_address: ${TRAEFIK_IP}
    labels:
      - "traefik.enable=true"
      - >-
        traefik.http.routers.traefik-dashboard.rule=${TRAEFIK_HOST_RULE} &&
        (PathPrefix(`/dashboard`) || PathPrefix(`/api`))
      - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
      - "traefik.http.routers.traefik-dashboard.tls=${TRAEFIK_TLS_ENABLED}"
      - "traefik.http.routers.traefik-dashboard.tls.certresolver=${CERT_RESOLVER}"
      - "traefik.http.routers.traefik-dashboard-root.rule=${TRAEFIK_HOST_RULE} && Path(`/`)"
      - "traefik.http.routers.traefik-dashboard-root.entrypoints=websecure"
      - "traefik.http.routers.traefik-dashboard-root.service=api@internal"
      - "traefik.http.routers.traefik-dashboard-root.middlewares=to-dashboard"
      - "traefik.http.routers.traefik-dashboard-root.priority=1"
      - "traefik.http.routers.traefik-dashboard-root.tls=${TRAEFIK_TLS_ENABLED}"
      - "traefik.http.routers.traefik-dashboard-root.tls.certresolver=${CERT_RESOLVER}"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  homelab_macvlan:
    external: true
    name: ${NETWORK_NAME}
