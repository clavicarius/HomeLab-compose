# traefik.${HOMELAB_DOMAIN}
# Docker Compose file for the standalone Traefik reverse proxy.
#
# Traefik provides the shared HTTP/HTTPS entrypoints and discovers enabled
# services through the Docker provider on the external homelab network.
#
# Documentation : traefik/README.md
# Network setup : docs/network-architecture.md
# Helper scripts : docs/scripts.md

services:
  # traefik — standalone reverse proxy for all homelab services.
  #
  # Exposes:
  #   80                         — HTTP entrypoint, redirected to HTTPS
  #   443                        — HTTPS entrypoint
  #   ${TRAEFIK_DASHBOARD_PORT}  — insecure dashboard/API
  #
  # Volumes:
  #   ${DOCKER_SOCKET_PATH}:ro              — read-only Docker socket for discovery
  #   ${TRAEFIK_CERTS_PATH}:ro — optional TLS certificates
  #
  # Static IP: ${TRAEFIK_IP} on the external homelab network.
  traefik:
    image: traefik:v3.7
    container_name: traefik-homelab
    restart: unless-stopped
    command:
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.http.tls.certresolver=letsencrypt"
      - "--entrypoints.websecure.http.tls.domains[0].main=${HOMELAB_DOMAIN}"
      - "--entrypoints.websecure.http.tls.domains[0].sans=*.${HOMELAB_DOMAIN}"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=${NETWORK_NAME}"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--certificatesresolvers.letsencrypt.acme.email=${HOMELAB_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.provider=hetzner"
      - "--api.dashboard=true"
      - "--api.insecure=false"
      - "--ping=true"
    environment:
      HETZNER_API_KEY: ${HETZNER_API_TOKEN:-}
    ports:
      - "80:80"
      - "443:443"
      - "${TRAEFIK_DASHBOARD_PORT:-8088}:8080"
    volumes:
      - ${DOCKER_SOCKET_PATH}:/var/run/docker.sock:ro
      - ${TRAEFIK_CERTS_PATH}:/certs:ro
      - ${TRAEFIK_CONFIG_PATH}:/etc/traefik/dynamic:ro
      - ${TRAEFIK_ACME_PATH}:/letsencrypt
    networks:
      homelab_macvlan:
        ipv4_address: ${TRAEFIK_IP}
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  homelab_macvlan:
    external: true
    name: ${NETWORK_NAME}
