http:
  routers:
    dashboard:
      # file provider does not interpolate env vars — hostname must be literal
      # replace with proper domain and path to dashboard
      # rule: Host(`traefik.homelab.internal`) && (PathPrefix(`/dashboard`) || PathPrefix(`/api`))
      rule: Host(`${TRAEFIK_HOST}.${HOMELAB_DOMAIN}`) && (PathPrefix(`/dashboard`) || PathPrefix(`/api`))
      entryPoints:
        - websecure
      service: api@internal
      tls: {}

    dashboard-root-redirect:
      # replace with proper domain and path to dashboard
      # rule: Host(`traefik.homelab.internal`)
      rule: Host(`${TRAEFIK_HOST}.${HOMELAB_DOMAIN}`)
      entryPoints:
        - websecure
      middlewares:
        - to-dashboard
      service: api@internal
      priority: 1
      tls: {}
