http:
  routers:
    dashboard:
      # TODO-TO-BE-REPLACED: use HOMELAB_DOMAIN when file-provider interpolation is available.
      rule: Host(`traefik.home.example.com`) && (PathPrefix(`/dashboard`) || PathPrefix(`/api`))
      entryPoints:
        - websecure
      service: api@internal
      tls: {}

    dashboard-root-redirect:
      # TODO-TO-BE-REPLACED: use HOMELAB_DOMAIN when file-provider interpolation is available.
      rule: Host(`traefik.home.example.com`)
      entryPoints:
        - websecure
      middlewares:
        - to-dashboard
      service: api@internal
      priority: 1
      tls: {}
