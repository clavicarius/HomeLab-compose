http:
  middlewares:
    redirect-to-https:
      redirectScheme:
        scheme: https
        permanent: true

    to-dashboard:
      redirectRegex:
        regex: ".*"
        # TODO-TO-BE-REPLACED: use HOMELAB_DOMAIN when file-provider interpolation is available.
        replacement: "https://traefik.home.example.com/dashboard/"
        permanent: false
